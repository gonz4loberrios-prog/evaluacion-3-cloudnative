name: dsy1107-ventas

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: dsy-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_MAX_CLIENT_CNXNS: 200
    ports:
      - "2181:2181"
    networks: [ventas-net]

  kafka-1:
    image: confluentinc/cp-kafka:7.7.1
    container_name: dsy-kafka-1
    depends_on: [zookeeper]
    environment: &kafka-common
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_MS: 604800000
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_LOG4J_LOGGERS: "kafka.controller=INFO,kafka.server.KafkaApis=INFO"
    ports:
      - "9092:9092"
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    networks: [ventas-net]

  kafka-2:
    image: confluentinc/cp-kafka:7.7.1
    container_name: dsy-kafka-2
    depends_on: [zookeeper]
    environment:
      <<: *kafka-common
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:29092,PLAINTEXT_HOST://localhost:9093
    ports:
      - "9093:9093"
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    networks: [ventas-net]

  streams-app:
    build: .
    container_name: dsy-streams-app
    depends_on: [kafka-1, kafka-2]
    environment:
      BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_INTERNAL:-kafka-1:29092,kafka-2:29092}
      APPLICATION_ID: ${APPLICATION_ID:-ventas-streams-dsy1107}
      TOPIC_RAW: ${TOPIC_RAW:-ventas-raw}
      TOPIC_AGG: ${TOPIC_AGG:-ventas-agregadas}
      TOPIC_DLQ: ${TOPIC_DLQ:-ventas-raw-dlq}
      WINDOW_MS: ${WINDOW_MS:-60000}
      GRACE_MS: ${GRACE_MS:-30000}
      DEDUP_RETENTION_MS: ${DEDUP_RETENTION_MS:-86400000}
      NUM_STREAM_THREADS: ${NUM_STREAM_THREADS:-2}
      STATE_DIR: ${STATE_DIR:-/tmp/kafka-streams}
      METRICS_PORT: ${METRICS_PORT:-8081}
    ports:
      # 8081 suele estar ocupado en este equipo; el puerto interno no cambia para Prometheus.
      - "${METRICS_HOST_PORT:-18081}:8081"
    networks: [ventas-net]

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    container_name: dsy-kafka-exporter
    depends_on: [kafka-1, kafka-2]
    command:
      - "--kafka.server=kafka-1:29092"
      - "--kafka.server=kafka-2:29092"
    ports:
      - "${KAFKA_EXPORTER_PORT:-9308}:9308"
    networks: [ventas-net]

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: dsy-prometheus
    depends_on: [kafka-exporter, streams-app]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks: [ventas-net]

  grafana:
    image: grafana/grafana:11.3.0
    container_name: dsy-grafana
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks: [ventas-net]

networks:
  ventas-net:
    driver: bridge

volumes:
  kafka-1-data:
  kafka-2-data:
  grafana-data:
